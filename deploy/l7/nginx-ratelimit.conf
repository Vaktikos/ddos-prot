# Layer-7 protection template for HTTP/HTTPS services behind nginx.
#
# The Sentinel Shield agent works on packets (layers 3 and 4) and cannot see HTTP requests.
# Request-rate limits, connection limits and request-pattern rules belong in a reverse proxy
# or WAF in front of the service. The proxy makes the decisions; the Sentinel Shield agent only
# reads the reject log written below (l7_sources in the agent config), reports rejected-request
# rates and top sources to the panel, opens http_flood incidents, and - if the profile sets
# l7_source_rps and XDP is enabled - blocks sources that keep being rejected. The agent does not
# manage these nginx rules.
#
# The log must keep the ss_reject format below. If nginx sits behind a CDN or load balancer,
# set real_ip_header / set_real_ip_from so $remote_addr is the client, otherwise the agent
# would see (and could block) the CDN address.
#
# Include inside the http {} block, then reference the zones in your server {} block.

# Requests per second per client address, with a burst allowance for page loads.
limit_req_zone  $binary_remote_addr zone=ss_req:20m  rate=20r/s;
# Concurrent connections per client address.
limit_conn_zone $binary_remote_addr zone=ss_conn:20m;
# Stricter budget for expensive endpoints such as login or search.
limit_req_zone  $binary_remote_addr zone=ss_login:10m rate=2r/s;

# Log requests that were rejected, in a form that a log shipper or fail2ban-style tool can use.
log_format ss_reject '$remote_addr [$time_iso8601] "$request" $status limit=$limit_req_status ua="$http_user_agent"';

server {
    # listen 443 ssl; server_name example.net; ...

    limit_req  zone=ss_req burst=40 nodelay;
    limit_conn ss_conn 30;
    limit_req_status  429;
    limit_conn_status 429;

    # Slow-request attacks: do not let one client hold a connection open without sending data.
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          15s;
    keepalive_timeout     15s;
    client_max_body_size  10m;

    access_log /var/log/nginx/ss_reject.log ss_reject if=$limit_req_status;

    location /login {
        limit_req zone=ss_login burst=5 nodelay;
        # proxy_pass ...;
    }
}
