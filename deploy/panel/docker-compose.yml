# Central components only: PostgreSQL and the panel (API, control plane, web UI).
# Protection agents are NOT containers: they run natively under systemd because they
# must manage the host's nftables ruleset. See docs/OPERATIONS.md.
name: sentinel-shield

services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt: ["no-new-privileges:true"]

  panel:
    build:
      context: ../..
      dockerfile: deploy/panel/Dockerfile
    image: sentinel-shield/panel:0.1.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      PANEL_LISTEN: 0.0.0.0:8443
      PANEL_SIGNING_KEY_FILE: /var/lib/sentinel-panel/signing.key
      PANEL_WEB_DIR: /opt/sentinel/web
    ports:
      - "${PANEL_HOST_PORT:-8443}:8443"
    volumes:
      - panelstate:/var/lib/sentinel-panel
      - ./secrets:/run/secrets:ro
    networks: [internal, edge]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/opt/sentinel/bin/healthcheck", "https://127.0.0.1:8443/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  panelstate:

networks:
  internal:
    internal: true
  edge:
